# Stack desechable, exclusivo del script test-persistencia.sh. Nunca se usa
# para desarrollo. Sin "name:" ni "container_name:" a proposito: la
# identidad del proyecto la da SIEMPRE el "-p" que pasa el script en cada
# invocacion, nunca un valor fijo en este archivo -- asi cada corrida tiene
# su propio espacio de nombres, sin chocar entre si ni con avisens-project.
# Sin puertos publicados: el script habla con el contenedor solo por
# "docker compose exec", nunca por un puerto del host.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    # Sin esto, Postgres usa el volumen anonimo que su imagen declara por su
    # cuenta. "down" sin -v NO borra ese volumen anonimo -- queda huerfano,
    # sigue existiendo en el disco. El problema real es otro: el contenedor
    # que crea el siguiente "up" no tiene forma de saber cual era "el mismo"
    # volumen anonimo de antes (no tiene un nombre estable que lo identifique
    # como "de este servicio"), asi que Docker le da uno nuevo y vacio.
    # Verificado a mano: el volumen viejo seguia existiendo tras el down: solo
    # que el contenedor nuevo ya no lo usaba. Con un volumen NOMBRADO (sin
    # nombre fijo aqui: Compose lo prefija con el proyecto desechable de cada
    # corrida), el contenedor siguiente sabe exactamente cual volumen buscar
    # y lo reutiliza -- por eso "down" sin -v si conserva los datos.
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  datos_postgres:
