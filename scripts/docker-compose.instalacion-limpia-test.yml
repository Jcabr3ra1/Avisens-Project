# Stack completo, desechable, exclusivo del script test-instalacion-limpia.sh.
# Nunca se usa para desarrollo -- es una copia de prueba de los mismos
# Dockerfile reales, con sus propios recursos. Sin "container_name" (el real
# docker-compose.yml SI los fija, globales, por eso no se puede correr una
# segunda copia de ese archivo en paralelo) y sin puertos publicados al host
# (el script verifica todo por dentro de la red de Docker, via "exec").
# Secretos de prueba, sin valor real -- solo existen mientras corre el script.
services:
  database:
    build: ../database
    environment:
      POSTGRES_USER: avisens
      POSTGRES_PASSWORD: instalacion-limpia-test
      POSTGRES_DB: avisens
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avisens -d avisens"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../avisens-backend
      target: dev
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://avisens:instalacion-limpia-test@database:5432/avisens?schema=public"
      NODE_ENV: development
      JWT_SECRET: instalacion-limpia-test-jwt-secret-32-caracteres-min
      JWT_REFRESH_SECRET: instalacion-limpia-test-jwt-refresh-otro-distinto
      PORT: "3000"
      CORS_ORIGIN: http://localhost
      ML_URL: http://ml:8000
      ML_TIMEOUT_MS: "5000"
      ML_INTERNAL_TOKEN: instalacion-limpia-test-ml-token-32-caracteres-x
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ADMIN_EMAIL: admin@avisens.com
      ADMIN_PASSWORD: Avisens2026!
      CI: "true"
    command: sh -c "pnpm prisma generate && pnpm prisma migrate deploy && pnpm run start:dev"

  ml:
    build: ../avisens-ml
    environment:
      ML_INTERNAL_TOKEN: instalacion-limpia-test-ml-token-32-caracteres-x

  frontend:
    build:
      context: ../avisens-frontend
      target: dev
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://backend:3000/v1

volumes:
  pg_data:
