name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ml:
    name: ML · tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: avisens-ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            avisens-ml/requirements.txt
            avisens-ml/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
  backend:
    name: Backend · quality + integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: avisens
          POSTGRES_PASSWORD: avisens_ci
          POSTGRES_DB: avisens_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U avisens -d avisens_test" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: avisens-backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://avisens:avisens_ci@localhost:5432/avisens_test
      JWT_SECRET: ci-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: avisens-backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma migrate deploy
      - run: pnpm exec prisma validate
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec eslint "{src,test}/**/*.ts" --max-warnings 0
      - run: pnpm run test:unit
      - run: pnpm run test:e2e
      - run: pnpm run build
  frontend:
    name: Frontend · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: avisens-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: avisens-frontend/package-lock.json
      - run: npm ci
      - run: npm run build
