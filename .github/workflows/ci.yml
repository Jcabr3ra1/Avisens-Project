# CI de Avisens — la "restricción" que obliga a que el código demuestre que
# funciona. Corre en cada push a main y en cada Pull Request.
#
# Gates (si alguno falla, el push queda marcado en rojo en GitHub):
#   Backend  → prisma generate · tsc --noEmit · eslint · jest (con cobertura)
#   Frontend → build (tsc + vite)
#
# Las pruebas mockean Prisma, así que NO necesitan base de datos en el CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend · tsc · lint · tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: avisens-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: avisens-backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente de Prisma
        # prisma.config.ts exige DATABASE_URL; generate no se conecta a la base.
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Typecheck (tsc)
        run: npx tsc --noEmit

      - name: Lint (eslint, cero warnings)
        run: npx eslint src --max-warnings 0

      - name: Pruebas + cobertura (jest)
        run: npx jest --coverage --coverageReporters=text-summary

  frontend:
    name: Frontend · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: avisens-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: avisens-frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Build (tsc + vite)
        run: npm run build
