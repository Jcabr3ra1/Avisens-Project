; platformio.ini — Firmware de la ESP32-CAM (AI-Thinker) del galpón.
;
; Toma una foto cada INTERVALO_FOTO_MS y la envía al backend (POST
; /ingest/foto con X-Device-Token). El análisis (detección de pollos y
; quietud) se hace en el servidor con el modelo YOLO; la cámara solo fotografía.

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
; La placa no tiene USB: se programa con un Arduino UNO como puente (RX→U0R,
; TX→U0T, RESET del UNO a GND) o con un adaptador FTDI, con GPIO0 a GND.
upload_speed = 115200
board_build.partitions = huge_app.csv
