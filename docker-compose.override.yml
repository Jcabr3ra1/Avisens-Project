# Overrides SOLO para desarrollo local. Docker Compose lo carga automaticamente
# encima de docker-compose.yml al hacer `docker compose up`.
# Da hot-reload: al editar el codigo, el servicio se recarga sin `--build`.
# En produccion NO se usa (se levanta solo el base: `docker compose -f docker-compose.yml up`).
services:
  # Backend NestJS en modo watch (nest --watch). Usa la etapa `dev` del Dockerfile.
  # Al arrancar: migra la base + siembra roles y admin (idempotente), para que
  # cualquier compañero tenga login listo sin correr nada a mano.
  backend:
    build:
      target: dev
    command: sh -c "pnpm prisma migrate deploy && pnpm run seed && pnpm run start:dev"
    environment:
      # Admin de DESARROLLO local (no es prod). El seed lo crea con estas vars.
      ADMIN_EMAIL: admin@avisens.com
      ADMIN_PASSWORD: Avisens2026!
    volumes:
      - ./avisens-backend:/app
      - /app/node_modules

  # Microservicio Python con uvicorn --reload.
  ml:
    volumes:
      - ./avisens-ml:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
