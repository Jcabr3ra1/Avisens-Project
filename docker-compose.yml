# Orquestacion completa de Avisens: base de datos, Redis, backend, frontend y ML.
#
# Este archivo describe el despliegue de PRODUCCION. En local, Docker Compose
# carga ademas docker-compose.override.yml, que le agrega hot-reload, el seed y
# los puertos de depuracion.
#
# Levantar en desarrollo:  docker compose up --build
# Levantar en produccion:  docker compose -f docker-compose.yml up --build -d
# Apagar:                  docker compose down
# Apagar + borrar la base: docker compose down -v
#
# Antes del primer arranque:  cp .env.example .env  y rellenar los secretos.
#
# Acceso una vez arriba:
#   - Frontend (nginx):     http://localhost:8080
#   - Backend / Swagger:    http://localhost:3000/docs
#   - PostgreSQL:           solo por la red interna (en dev, localhost:5433)

services:
  # ----- Base de datos PostgreSQL -----
  # No publica ningun puerto: solo se llega a ella por la red interna de Docker.
  # El override la expone en el 5433 del host para poder inspeccionarla en local.
  database:
    build: ./database
    container_name: avisens-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: avisens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env (ver .env.example)}
      POSTGRES_DB: avisens
    volumes:
      - avisens_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avisens -d avisens"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ----- Redis (cola de trabajos en segundo plano) -----
  # Lo usa BullMQ para los mensajes de WhatsApp: el webhook encola y responde 200
  # de inmediato; el procesado real ocurre aparte y sobrevive a un reinicio.
  redis:
    image: redis:7-alpine
    container_name: avisens-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - avisens_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ----- Backend NestJS -----
  backend:
    build: ./avisens-backend
    container_name: avisens-backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 'database' es el nombre del servicio: dentro de la red de Docker
      # reemplaza a 'localhost'.
      DATABASE_URL: "postgresql://avisens:${POSTGRES_PASSWORD}@database:5432/avisens?schema=public"
      NODE_ENV: ${NODE_ENV:-production}
      # Los secretos NO se escriben aqui: este archivo esta versionado en un
      # repositorio publico. Los lee del .env de la raiz, que si esta ignorado.
      # El `:?` hace que Compose se niegue a arrancar si faltan, en vez de
      # dejar pasar un valor por defecto que todo el mundo conoce.
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env (ver .env.example)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?falta JWT_REFRESH_SECRET en .env (ver .env.example)}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      PORT: 3000
      # Dominio desde el que el navegador carga el frontend (nginx). Obligatoria
      # en produccion: sin ella la app no arranca (evita CORS abierto).
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      # Sembrar apagado por defecto. El override lo enciende en desarrollo.
      RUN_SEED: ${RUN_SEED:-false}
      # Copiloto IA. La key se lee del .env de la raiz.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-haiku-4-5}
      # Redis para la cola de BullMQ. 'redis' es el nombre del servicio: dentro
      # de la red de Docker reemplaza a 'localhost'.
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JOBS_ENABLED: ${JOBS_ENABLED:-true}
      JOB_HISTORY_DAYS: ${JOB_HISTORY_DAYS:-30}
      IOT_IDEMPOTENCY_DAYS: ${IOT_IDEMPOTENCY_DAYS:-30}
      ML_URL: http://ml:8000
      ML_TIMEOUT_MS: 5000
      ML_INTERNAL_TOKEN: ${ML_INTERNAL_TOKEN:?falta ML_INTERNAL_TOKEN en .env (ver .env.example)}
      # WhatsApp Cloud API. 'simulado' por defecto a proposito: si alguien
      # despliega sin configurar nada, NO manda mensajes reales por accidente.
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-simulado}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v25.0}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET}
      WHATSAPP_MINUTOS_INACTIVIDAD: ${WHATSAPP_MINUTOS_INACTIVIDAD:-5}
    ports:
      - "3000:3000"

  # ----- Frontend React + nginx -----
  frontend:
    build:
      context: ./avisens-frontend
      args:
        # El navegador pega a /api y nginx lo reenvia al backend
        VITE_API_URL: /api
    container_name: avisens-frontend
    restart: unless-stopped
    depends_on:
      # Espera a que el backend responda /health, no solo a que arranque: si
      # nginx sube antes, las primeras peticiones a /api dan 502.
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

  # ----- Microservicio de ML (predicciones) en Python -----
  ml:
    build: ./avisens-ml
    container_name: avisens-ml
    restart: unless-stopped
    environment:
      ML_INTERNAL_TOKEN: ${ML_INTERNAL_TOKEN:?falta ML_INTERNAL_TOKEN en .env (ver .env.example)}
    expose:
      - "8000"

volumes:
  avisens_pg_data:
  avisens_redis_data:
