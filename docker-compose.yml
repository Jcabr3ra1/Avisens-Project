# Orquestación completa de Avisens: base de datos, backend y frontend.
#
# Levantar todo:   docker compose up --build
# Apagar:          docker compose down
# Apagar + borrar la base de datos: docker compose down -v
#
# Acceso una vez arriba:
#   - Frontend (nginx):     http://localhost:8080
#   - Backend / Swagger:    http://localhost:3000/docs
#   - PostgreSQL:           localhost:5432  (usuario/clave: avisens)

services:
  # ----- Base de datos PostgreSQL -----
  database:
    build: ./database
    container_name: avisens-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: avisens
      POSTGRES_PASSWORD: avisens
      POSTGRES_DB: avisens
    ports:
      - "5432:5432"
    volumes:
      - avisens_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avisens -d avisens"]
      interval: 5s
      timeout: 5s
      retries: 10
  
  # ----- Redis (cola de trabajos en segundo plano) -----
  # Lo usa BullMQ para los mensajes de WhatsApp: el webhook encola y responde 200
  # de inmediato; el procesado real ocurre aparte y sobrevive a un reinicio.
  redis:
    image: redis:7-alpine
    container_name: avisens-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - avisens_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ----- Backend NestJS -----
  backend:
    build: ./avisens-backend
    container_name: avisens-backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 'database' es el nombre del servicio: dentro de la red de Docker
      # reemplaza a 'localhost'.
      DATABASE_URL: "postgresql://avisens:avisens@database:5432/avisens?schema=public"
      NODE_ENV: development
      JWT_SECRET: cambia-esto-por-un-secreto-largo-y-aleatorio
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: otro-secreto-distinto-tambien-largo
      JWT_REFRESH_EXPIRES_IN: 7d
      PORT: 3000
      # Dominio desde el que el navegador carga el frontend (nginx). Obligatoria
      # en producción: sin ella la app no arranca (evita CORS abierto).
      CORS_ORIGIN: "http://localhost:8080"
      # Crea el usuario admin del seed al arrancar (idempotente). Así quien haga
      # `docker compose up` obtiene la base lista sin correr nada a mano.
      RUN_SEED: "true"
      # Copiloto IA. La key NO va escrita aqui: Docker Compose la lee del .env
      # de la raiz (que esta en .gitignore) para no versionar el secreto.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-haiku-4-5}
      # Redis para la cola de BullMQ. 'redis' es el nombre del servicio: dentro
      # de la red de Docker reemplaza a 'localhost'.
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # WhatsApp Cloud API. 'simulado' por defecto a proposito: si alguien
      # despliega sin configurar nada, NO manda mensajes reales por accidente.
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-simulado}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v25.0}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
    ports:
      - "3000:3000"

  # ----- Frontend React + nginx -----
  frontend:
    build:
      context: ./avisens-frontend
      args:
        # El navegador pega a /api y nginx lo reenvía al backend
        VITE_API_URL: /api
    container_name: avisens-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

  # ----- Microservicio de ML (predicciones) en Python -----
  ml:
    build: ./avisens-ml
    container_name: avisens-ml
    restart: unless-stopped
    ports:
      - "8000:8000"

volumes:
  avisens_pg_data:
  avisens_redis_data:
