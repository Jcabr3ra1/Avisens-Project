; platformio.ini — Configuración del proyecto PlatformIO para el nodo ESP32.
; Framework Arduino (C++ en VS Code, sin el Arduino IDE): así las librerías de
; sensores (DHT, etc.) funcionan al instante.
;
; Si tu placa NO es una ESP32 DevKit genérica, cambia `board`. Busca el tuyo en:
; https://docs.platformio.org/en/latest/boards/index.html#espressif-32

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Librerías que PlatformIO descarga solo al compilar (no hay que instalarlas a mano).
lib_deps =
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor
