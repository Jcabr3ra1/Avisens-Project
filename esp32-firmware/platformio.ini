; platformio.ini — Configuración del proyecto PlatformIO para el nodo ESP32.
; Framework Arduino (C++ en VS Code, sin el Arduino IDE): así las librerías de
; sensores (DHT, etc.) funcionan al instante.
;
; Si tu placa NO es una ESP32 DevKit genérica, cambia `board`. Busca el tuyo en:
; https://docs.platformio.org/en/latest/boards/index.html#espressif-32

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Dos particiones de app de 1.9 MB para actualizar por WiFi (OTA) desde el
; portal: con portal y HTTPS el firmware ocupa ~1 MB y en las de 1.25 MB por
; defecto quedaría poco margen para crecer. El nodo no usa SPIFFS. Cambiar
; esta tabla exige grabar una vez por USB.
board_build.partitions = min_spiffs.csv

; Librerías que PlatformIO descarga solo al compilar (no hay que instalarlas a mano).
lib_deps =
    beegee-tokyo/DHT sensor library for ESPx
    adafruit/Adafruit Unified Sensor
    madhephaestus/ESP32Servo
    bblanchon/ArduinoJson
